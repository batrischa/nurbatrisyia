<script>
 function updateClock() {
 const now = new Date();
 const options = { 
  year: 'numeric', 
  month: '2-digit', 
  day: '2-digit', 
  hour: '2-digit', 
  minute: '2-digit', 
  hour12: false 
 };
 const timeString = now.toLocaleTimeString('id-ID', options);   
 document.getElementById('realTimeClock').textContent = timeString;
}
 updateClock();
 setInterval(updateClock, 1000);
</script>
